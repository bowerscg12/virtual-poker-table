name: CI / Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  # ── Test ───────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vct
          POSTGRES_PASSWORD: vct
          POSTGRES_DB: virtual_card_table
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://vct:vct@localhost:5432/virtual_card_table
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @vct/shared-types
      - run: npm run db:migrate -w @vct/game-server
      - run: npm run typecheck
      - run: npm run test

  # ── Deploy (main/master only) ──────────────────────────────────────────────
  #
  # Required GitHub secrets:
  #   GCP_PROJECT_ID         — your GCP project ID (e.g. my-poker-app)
  #   GCP_SA_KEY             — JSON key for a service account with roles:
  #                              Cloud Run Admin, Artifact Registry Writer,
  #                              Service Account User, Firebase Admin SDK Admin Service Agent
  #   FIREBASE_SERVICE_ACCOUNT — Firebase Admin SDK service account JSON
  #                              (download from Firebase console → Project settings → Service accounts)
  #   DATABASE_URL           — Supabase connection string (used here for migrations)
  #
  # Required Google Cloud Secret Manager secrets (used by Cloud Run at runtime):
  #   vct-database-url       — Supabase connection string (Transaction mode pooler URL)
  #   vct-redis-url          — Upstash Redis URL
  #   vct-jwt-secret         — random secret string (e.g. openssl rand -hex 32)
  #   vct-web-origin         — Firebase Hosting URL (e.g. https://YOUR_PROJECT_ID.web.app)
  #
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      GCP_REGION: us-central1
      SERVICE_NAME: vct-game-server
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vct/game-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build -w @vct/shared-types

      # Run migrations against Supabase before deploying new server version
      - name: Run DB migrations
        run: npm run db:migrate -w @vct/game-server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── GCP auth ────────────────────────────────────────────────────────────
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: projects/867608402336/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: 867608402336-compute@developer.gserviceaccount.com
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP project
        run: gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      # ── Build & push Docker image to Artifact Registry ───────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # ── Deploy game server to Cloud Run ──────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE:${{ github.sha }} \
            --region $GCP_REGION \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3001 \
            --timeout 3600 \
            --set-secrets "DATABASE_URL=vct-database-url:latest,REDIS_URL=vct-redis-url:latest,JWT_SECRET=vct-jwt-secret:latest,WEB_ORIGIN=vct-web-origin:latest"

      # ── Build and deploy web frontend to Firebase Hosting ────────────────
      - name: Build web frontend
        run: npm run build -w @vct/web
        env:
          VITE_SERVER_URL: ${{ secrets.CLOUD_RUN_URL }}

      # firebase-tools authenticates via Application Default Credentials. Point it at the credential
      # file the auth step generated from Workload Identity Federation (the impersonated SA already
      # holds roles/firebasehosting.admin), so the deploy stays keyless — no service-account key,
      # which org policy (iam.disableServiceAccountKeyCreation) forbids anyway.
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
