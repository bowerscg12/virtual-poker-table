services:
  - type: web
    name: vct-api
    runtime: node
    buildCommand: npm install && npm run build -w @vct/game-server
    startCommand: npm run start -w @vct/game-server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vct-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vct-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: vct-web
    runtime: static
    buildCommand: npm install && npm run build -w @vct/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://vct-api.onrender.com/*
      - type: rewrite
        source: /ws
        destination: https://vct-api.onrender.com/ws

databases:
  - name: vct-db
    plan: free
